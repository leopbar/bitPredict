name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_ENV: ${{ secrets.VPS_ENV }}
        with:
          host: 13.140.166.97
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_ENV
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_DIR="/opt/bitpredict"

            # Write the production env file from the secret.
            # printf avoids shell interpretation of special characters in the value.
            printf '%s' "$VPS_ENV" > "${DEPLOY_DIR}/.env.production"
            chmod 600 "${DEPLOY_DIR}/.env.production"

            bash "${DEPLOY_DIR}/deploy/deploy.sh"
