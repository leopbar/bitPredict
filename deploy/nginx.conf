# /etc/nginx/sites-available/bitpredict
# Reverse proxy for bitpredict.lbai.dev → Next.js container on localhost:3005
# SSL certificates are managed by Certbot (certbot --nginx).

server {
    listen 80;
    server_name bitpredict.lbai.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bitpredict.lbai.dev;

    # Certbot fills these in automatically; placeholders here for reference.
    ssl_certificate     /etc/letsencrypt/live/bitpredict.lbai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitpredict.lbai.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Pass all traffic to the Next.js frontend (which proxies /api/* to the backend).
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE support (used by streaming endpoints).
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Generous timeouts for slow LLM streaming responses.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
